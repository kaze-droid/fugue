[package]
name = "fugue-os"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
rand = "0.9.2"
raylib = "5.5.1"
tokenizers = "0.19"  # HuggingFace tokenizers for text embedding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"  # HTTP client for OpenAI API
dotenvy = "0.15"  # Load .env file